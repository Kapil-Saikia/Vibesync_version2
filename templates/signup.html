<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#ec4899">
    <title>VibeSync — Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ec4899;
            --secondary: #8b5cf6;
            --dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 0;
        }

        /* Animated Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out alternate;
            z-index: 0;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--primary); top: -50px; left: -50px; }
        .orb-2 { width: 500px; height: 500px; background: var(--secondary); bottom: -100px; right: -50px; animation-delay: -5s; }
        .orb-3 { width: 300px; height: 300px; background: #f97316; top: 50%; left: 30%; transform: translate(-50%, -50%); animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 60px) scale(1.1); }
            100% { transform: translate(-30px, 30px) scale(0.9); }
        }

        .signup-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            padding: 0 1.5rem;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 2.5rem 2.5rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        .brand {
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.75rem;
            box-shadow: 0 10px 25px rgba(139, 92, 246, 0.3);
            position: relative;
        }

        .brand-icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .brand-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.25rem;
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .form-row .input-group {
            margin-bottom: 0;
            flex: 1;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .input-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1rem 1rem 3rem;
            color: white;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group.no-icon .input-control {
            padding-left: 1rem;
        }

        .input-control:focus {
            border-color: var(--secondary);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
        }

        .input-control::placeholder {
            color: transparent;
        }

        .input-label {
            position: absolute;
            left: 3rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-group.no-icon .input-label {
            left: 1rem;
        }

        .input-control:focus ~ .input-label,
        .input-control:not(:placeholder-shown) ~ .input-label {
            top: 0;
            left: 0.8rem;
            font-size: 0.75rem;
            background: var(--dark);
            padding: 0 0.5rem;
            color: var(--secondary);
            border-radius: 4px;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--text-muted);
            transition: all 0.3s ease;
            pointer-events: none;
        }

        .input-control:focus ~ .input-icon {
            color: var(--secondary);
        }

        .password-strength {
            margin-top: 0.5rem;
            font-size: 0.75rem;
        }

        .strength-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin: 0.4rem 0;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .strength-weak { background: #ef4444; width: 25%; }
        .strength-fair { background: #f97316; width: 50%; }
        .strength-good { background: #eab308; width: 75%; }
        .strength-strong { background: #22c55e; width: 100%; }

        .strength-text {
            color: var(--text-muted);
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .checkbox-group a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.3s;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        .checkbox-wrapper {
            position: relative;
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .checkbox-wrapper input {
            opacity: 0;
            position: absolute;
            inset: 0;
            cursor: pointer;
            z-index: 2;
        }

        .checkbox-custom {
            position: absolute;
            inset: 0;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .checkbox-wrapper input:checked + .checkbox-custom {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox-custom::after {
            content: '';
            width: 4px;
            height: 8px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            opacity: 0;
        }

        .checkbox-wrapper input:checked + .checkbox-custom::after {
            opacity: 1;
        }

        .submit-btn {
            width: 100%;
            padding: 1.1rem;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            color: white;
            border: none;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .switch-auth {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .switch-auth a {
            color: white;
            text-decoration: none;
            font-weight: 600;
            margin-left: 0.5rem;
            transition: color 0.3s;
        }

        .switch-auth a:hover {
            color: var(--secondary);
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border-left: 3px solid #ef4444;
            color: #fca5a5;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
            align-items: center;
            gap: 0.5rem;
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 480px) {
            .form-row {
                flex-direction: column;
                gap: 1.25rem;
                margin-bottom: 1.25rem;
            }
            .glass-card {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="signup-wrapper">
        <div class="glass-card">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
                <h1 class="brand-title">Join VibeSync</h1>
                <p class="brand-subtitle">Find the music that matches your emotions.</p>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="signupForm">
                <div class="form-row">
                    <div class="input-group no-icon">
                        <input type="text" id="firstName" class="input-control" placeholder="First Name" required>
                        <label class="input-label" for="firstName">First Name</label>
                    </div>
                    <div class="input-group no-icon">
                        <input type="text" id="lastName" class="input-control" placeholder="Last Name" required>
                        <label class="input-label" for="lastName">Last Name</label>
                    </div>
                </div>

                <div class="input-group">
                    <input type="email" id="email" class="input-control" placeholder="Email Address" required>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <label class="input-label" for="email">Email Address</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" class="input-control" placeholder="Password" required>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <label class="input-label" for="password">Create Password</label>
                    
                    <div class="password-strength">
                        <div class="strength-bar">
                            <div id="strengthFill" class="strength-fill"></div>
                        </div>
                        <span id="strengthText" class="strength-text"></span>
                    </div>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" class="input-control" placeholder="Confirm Password" required>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"></path></svg>
                    <label class="input-label" for="confirmPassword">Confirm Password</label>
                </div>

                <div class="checkbox-group">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="terms" required>
                        <div class="checkbox-custom"></div>
                    </div>
                    <div>
                        I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
                    </div>
                </div>

                <button type="submit" id="signupButton" class="submit-btn">
                    <div id="spinner" class="spinner"></div>
                    <span id="buttonText">Initialize Account</span>
                </button>
            </form>

            <div class="switch-auth">
                Already have an account? <a href="/login">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('signupForm');
        const firstNameInput = document.getElementById('firstName');
        const lastNameInput = document.getElementById('lastName');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const signupButton = document.getElementById('signupButton');
        const buttonText = document.getElementById('buttonText');
        const spinner = document.getElementById('spinner');
        const errorContainer = document.getElementById('errorMessage');
        const strengthFill = document.getElementById('strengthFill');
        const strengthText = document.getElementById('strengthText');

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            let strength = 0;
            if (val.length >= 8) strength++;
            if (/[a-z]/.test(val)) strength++;
            if (/[A-Z]/.test(val)) strength++;
            if (/[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;
            
            let cls = '', text = '';
            if (strength <= 1) { cls = 'strength-weak'; text = 'Weak'; }
            else if (strength === 2) { cls = 'strength-fair'; text = 'Fair'; }
            else if (strength >= 3 && strength <= 4) { cls = 'strength-good'; text = 'Good'; }
            else if (strength === 5) { cls = 'strength-strong'; text = 'Strong'; }
            
            strengthFill.className = `strength-fill ${cls}`;
            strengthText.textContent = val.length > 0 ? `Password strength: ${text}` : '';
        });

        function setError(message) {
            if (message) {
                errorContainer.innerHTML = message;
                errorContainer.style.display = 'flex';
            } else {
                errorContainer.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const payload = {
                firstName: firstNameInput.value.trim(),
                lastName: lastNameInput.value.trim(),
                email: emailInput.value.trim(),
                password: passwordInput.value,
                confirmPassword: confirmPasswordInput.value
            };

            if (!payload.firstName || !payload.lastName || !payload.email || !payload.password || !payload.confirmPassword) {
                setError('Please fill in all fields');
                return;
            }

            if (payload.password !== payload.confirmPassword) {
                setError('Passwords do not match');
                return;
            }

            setError('');
            signupButton.disabled = true;
            spinner.style.display = 'inline-block';
            buttonText.textContent = 'Processing...';

            try {
                const response = await fetch('/api/auth/signup', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (data.success) {
                    buttonText.textContent = 'Account Created!';
                    spinner.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = data.redirect || '/login';
                    }, 500);
                } else {
                    throw new Error(data.message || 'Registration failed');
                }
            } catch (err) {
                setError(err.message || 'An error occurred during registration');
                signupButton.disabled = false;
                spinner.style.display = 'none';
                buttonText.textContent = 'Initialize Account';
            }
        });
    </script>
</body>
</html>
