<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#7c3aed">
    <meta name="description" content="Sign in to VibeSync for emotion-based music recommendations." />
    <title>VibeSync — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    

    <link rel="manifest" href="/static/manifest.json" />
    <link rel="icon" href="/static/assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/static/assets/icons/icon-192.png" />
    <link rel="stylesheet" href="/static/css/vibesync-theme.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body class="auth-body">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="login-wrapper">
        <div class="glass-card">
            <div class="brand">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
                <h1 class="brand-title">VibeSync</h1>
                <p class="brand-subtitle">Rethink how you experience music.</p>
            </div>

            <div class="demo-notice">
                Testing? Use any email with password <strong>vibesync2026</strong>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="input-group">
                    <input type="email" id="email" class="input-control" placeholder="Email" required autocomplete="email">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <label class="input-label" for="email">Email Address</label>
                </div>

                <div class="input-group">
                    <input type="password" id="password" class="input-control" placeholder="Password" required>
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <label class="input-label" for="password">Password</label>
                </div>

                <div class="utils-row">
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" id="loginButton" class="submit-btn">
                    <div id="spinner" class="spinner"></div>
                    <span id="buttonText">Access Portal</span>
                </button>
            </form>

            <div class="switch-auth">
                New to the sync? <a href="/signup">Create Account</a>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const loginButton = document.getElementById('loginButton');
        const buttonText = document.getElementById('buttonText');
        const spinner = document.getElementById('spinner');
        const errorContainer = document.getElementById('errorMessage');

        function setError(message) {
            if (message) {
                errorContainer.innerHTML = message;
                errorContainer.style.display = 'flex';
            } else {
                errorContainer.style.display = 'none';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                setError('Please fill in all fields');
                return;
            }

            setError('');
            loginButton.disabled = true;
            spinner.style.display = 'block';
            buttonText.textContent = 'Syncing...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    buttonText.textContent = 'Synced successfully!';
                    spinner.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = data.redirect || '/';
                    }, 500);
                } else {
                    throw new Error(data.message || 'Invalid credentials');
                }
            } catch (err) {
                setError(err.message || 'An error occurred during sign in');
                loginButton.disabled = false;
                spinner.style.display = 'none';
                buttonText.textContent = 'Access Portal';
            }
        });
    </script>
</body>
</html>
